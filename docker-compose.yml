# browl's two services (DESIGN.md §2.1, O-1). Settings (§2.12) come from .env; see .env.example.
name: browl

# Both services' health checks run on the same schedule.
x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 5s
  start_period: 30s
  start_interval: 2s

services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${BROWL_PORT:-8000}:8000"
    volumes:
      - data:/data
      # The app's loader builds each new TDB2 store under /fuseki/databases, where Fuseki opens it (§2.4).
      - fuseki:/fuseki
    depends_on:
      - fuseki
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/$${RESERVED_PREFIX:-_browl}/health"]
      <<: *healthcheck-timing
    restart: unless-stopped

  fuseki:
    build: docker/fuseki
    # No published ports: the admin protocol is open to anything that reaches Fuseki (docker/fuseki/shiro.ini).
    environment:
      # The heap: 1g holds NCBITaxon's bulk queries with about 2x headroom; raise it for larger ontologies or large
      # imports. Direct (I/O) buffers are capped above what docker/fuseki/jetty.xml's buffer pool can hold (64 MB) and
      # 20 requests' 2 MB buffers. The container needs about the heap plus 0.5 GiB: 1.5 GiB at the default (DESIGN.md
      # §2.4, S-6).
      JDK_JAVA_OPTIONS: -Xmx${FUSEKI_HEAP:-1g} -XX:MaxDirectMemorySize=128m
    # No memory limit unless FUSEKI_MEM_LIMIT is set (0 means none): a limit contains a runaway Fuseki, but must be
    # raised with FUSEKI_HEAP (DESIGN.md §2.4).
    mem_limit: ${FUSEKI_MEM_LIMIT:-0}
    volumes:
      - fuseki:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$$/ping"]
      <<: *healthcheck-timing
    restart: unless-stopped

volumes:
  # DATA_DIR: uploads, the derived database, job state.
  data:
  # FUSEKI_BASE: the registered datasets and their TDB2 stores.
  fuseki:
