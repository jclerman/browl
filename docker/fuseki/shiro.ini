# Fuseki's access control. Everything, the admin protocol included, is open to any client that can reach Fuseki: the
# app, on the Compose network, calls the admin protocol to switch stores. That's safe only because docker-compose.yml
# doesn't publish Fuseki's port. Fuseki's default shiro.ini allows the admin protocol from localhost only.
[main]
ssl.enabled = false

[urls]
/** = anon
