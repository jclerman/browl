# tbls config for the state database (docs/SCHEMA.md); `make schema-docs` regenerates docs/schema/state/ from it.
# The database is the one scripts/schema_dbs.py builds by running browl.jobs.MIGRATIONS on an empty file.
name: 'Database schema: `state`'
desc: >
  The schema of the SQLite database browl calls `state`, which holds the app's own persistent state. These pages are
  generated from the code by [tbls](https://github.com/k1LoW/tbls) (`make schema-docs`; overview in
  [docs/SCHEMA.md](../../SCHEMA.md)): edit `.tbls/state.yml`, not them.


  browl keeps this SQLite file, `DATA_DIR/state.sqlite3`, for the load job's state (stage, generation numbers, errors),
  shared by all the app's workers, the admins added in the UI, and when accounts signed out. It's authoritative and
  persistent, and migrates forward from its recorded version when browl starts
  ([DESIGN.md 2.4](../../DESIGN.md#24-load-pipeline)).
dsn: sqlite://.cache/schema-dbs/state.sqlite3
docPath: docs/schema/state
er:
  format: mermaid
format:
  adjust: true
lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
comments:
  - table: job
    tableComment: >-
      The latest load job (browl.jobs.JobState), at most one row: each job replaces the previous one's. Times are ISO
      8601 with a time zone.
    columnComments:
      id: Always 1, so the table has at most one row.
      generation: The job's generation number, one more than the previous job's.
      stage: The stage the job is in, or reached (ready), or failed in (browl.jobs.Stage).
      started_at: When the job started.
      finished_at: When it reached ready or failed; NULL while it runs.
      failed_stage: The stage it failed in; NULL unless it failed.
      reason: Why it failed, cut to MAX_REASON_CHARS; NULL unless it failed.
      ready_generation: >-
        The generation of the latest job that reached ready, this one or an earlier one; NULL if none has.
      reasoner: The reasoner the admin chose (browl.jobtypes.Reasoner); 'none' skips the reasoning stage.
      upload_name: The uploaded file's name, as the admin's browser gave it; NULL if none.
      upload_syntax: The file's syntax, e.g. 'RDF/XML'.
      upload_bytes: The file's size; while uploading, or after a failed upload, how much arrived.
      imports: >-
        The ontology's imports, direct and indirect, as a JSON list of browl.jobtypes.ImportResult; '[]' until the
        imports stage lists them.
      triples: How many triples the store's default graph holds once loaded, the ontology without its imports.
      prefixes: >-
        The prefixes the ontology file declares, as a JSON object of name to namespace IRI, for CURIEs; '{}' until
        the loading stage reads them.
      stage_started_at: When the current stage started (P-31); NULL in a row stored before it was recorded.
      stage_seconds: >-
        How long each stage that ended took, in seconds, as a JSON object of stage (browl.jobs.Stage) to seconds,
        the stage the job failed in included; '{}' before any has ended.
      detail: >-
        What the running stage is doing, e.g. 'Checking for unsatisfiable classes', recorded at most every PROGRESS_S
        (P-31); NULL if it hasn't said, and once it ends.
      fraction: How far the running stage has got, from 0 to 1; NULL if it can't tell, and once it ends.
      detail_iri: >-
        The IRI the running stage is working on, e.g. the import being fetched (P-31), kept apart from detail because
        only the admin status shows it, as the "loading" page is public; NULL if none, and once the stage ends.
  - table: admin
    tableComment: >-
      Admins added in the UI (DESIGN.md 2.11): a signed-in user whose verified email is here, or in SEED_ADMINS, is an
      admin. P-22 creates the table; P-23's admins page manages it.
    columnComments:
      email: >-
        The admin's email address in its canonical form (browl.admins.canonical_email): lowercased, and for Gmail
        without the dots in its local part.
      added_at: When the admin was added, ISO 8601 with a time zone.
      added_by: The email address of the admin who added them; NULL if added with AUTH_DISABLED, or before P-23.
  - table: sign_out
    tableComment: >-
      When each account last signed out (DESIGN.md 2.11), admin or not: a session for that email that started at or
      before then is refused, so signing out ends the account's sessions on every device.
    columnComments:
      email: The account's email address in its canonical form (browl.admins.canonical_email).
      signed_out_at: When it last signed out, ISO 8601 with a time zone.
