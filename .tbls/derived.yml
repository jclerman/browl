# tbls config for the derived database (docs/SCHEMA.md); `make schema-docs` regenerates docs/schema/derived/ from it.
# The database is the one scripts/schema_dbs.py builds from browl.derived.SCHEMA and INDEXES.
name: 'Database schema: `derived`'
desc: >
  The schema of the SQLite database browl calls `derived`, which holds data derived from the loaded ontology. These
  pages are generated from the code by [tbls](https://github.com/k1LoW/tbls) (`make schema-docs`; overview in
  [docs/SCHEMA.md](../../SCHEMA.md)): edit `.tbls/derived.yml`, not them.


  browl builds one such SQLite file per load, `DATA_DIR/derived/{generation}.sqlite3`, from bulk SPARQL queries against
  the ontology in Fuseki. It holds whatever needs the whole ontology (entities and their URLs, names, hierarchies,
  counts, search), so pages never query Fuseki for it. It's a cache: rebuilt on every load, never migrated
  ([DESIGN.md 2.5](../../DESIGN.md#25-derived-data-pre-caching)).
dsn: sqlite://.cache/schema-dbs/derived.sqlite3
docPath: docs/schema/derived
er:
  format: mermaid
format:
  adjust: true
lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
# The tables refer to entities by entity.id, with no foreign keys: the build fills each table whole and never updates
# it, so SQLite needn't check them.
relations:
  - table: name_value
    columns: [entity]
    parentTable: entity
    parentColumns: [id]
    def: name_value.entity references entity.id
    cardinality: zero_or_more
    parentCardinality: exactly_one
  - table: edge
    columns: [parent]
    parentTable: entity
    parentColumns: [id]
    def: edge.parent references entity.id
    cardinality: zero_or_more
    parentCardinality: exactly_one
  - table: edge
    columns: [child]
    parentTable: entity
    parentColumns: [id]
    def: edge.child references entity.id
    cardinality: zero_or_more
    parentCardinality: exactly_one
  - table: equiv_group
    columns: [entity]
    parentTable: entity
    parentColumns: [id]
    def: equiv_group.entity references entity.id
    cardinality: zero_or_one
    parentCardinality: exactly_one
  - table: equiv_group
    columns: [representative]
    parentTable: entity
    parentColumns: [id]
    def: equiv_group.representative references entity.id
    cardinality: zero_or_more
    parentCardinality: exactly_one
  - table: counts
    columns: [node]
    parentTable: entity
    parentColumns: [id]
    def: counts.node references entity.id
    cardinality: zero_or_more
    parentCardinality: exactly_one
  - table: usage_root
    columns: [owner]
    parentTable: entity
    parentColumns: [id]
    def: usage_root.owner references entity.id
    cardinality: zero_or_more
    parentCardinality: zero_or_one
  - table: usage_ref
    columns: [entity]
    parentTable: entity
    parentColumns: [id]
    def: usage_ref.entity references entity.id
    cardinality: zero_or_more
    parentCardinality: exactly_one
  - table: usage_ref
    columns: [root]
    parentTable: usage_root
    parentColumns: [id]
    def: usage_ref.root references usage_root.id
    cardinality: one_or_more
    parentCardinality: exactly_one
  - table: usage_blank
    columns: [entity]
    parentTable: entity
    parentColumns: [id]
    def: usage_blank.entity references entity.id
    cardinality: zero_or_one
    parentCardinality: exactly_one
comments:
  - table: meta
    tableComment: >-
      What the database was built from (browl.derived.Meta), one row. generation is read from a file built by any
      browl, so it keeps its name.
    columnComments:
      id: Always 1, so the table has one row.
      generation: The load job's generation number; the file is current only for that generation.
      ontology_iri: The ontology's IRI, from its own graph; NULL if it has none.
      version_iri: Its owl:versionIRI; NULL if it has none.
      title: Its title (dcterms:title, dc:title, then NAME_PROPERTIES); NULL if it has none, and pages show the IRI.
      version_info: Its owl:versionInfo; NULL if it has none.
      reasoner: The reasoner the load ran (browl.jobtypes.Reasoner).
      loaded_at: When the load job started, ISO 8601 with a time zone; a rebuild after a restart keeps it.
  - table: build_key
    tableComment: >-
      The build keys the file was built with, one per component (browl.precache.keys, DESIGN.md 2.5). The file is
      current only if they're the components and keys the running browl computes, so a change to the code or settings
      that build it rebuilds it. Read from a file built by any browl, so it keeps its name and columns; a file without
      it, built before build keys, isn't current.
    columnComments:
      component: >-
        What the key covers: schema (browl.derived.SCHEMA and INDEXES), meta (the ontology header and the meta row), or
        a pre-caching hook, by name (e.g. entities).
      key: >-
        A SHA-256, in hex, of what the component depends on: for schema, its SQL; for the others, their code (their
        browl modules' syntax trees, without docstrings, the files they load through sparql_file, the third-party
        distributions' versions, Python's version) and the values of the settings they declare.
  - table: entity
    tableComment: >-
      The ontology itself and every declared class and property, with the URL its IRI implies (DESIGN.md 2.3,
      browl.urls), filled by the entities pre-caching hook. An IRI declared with several types (punning) has a row
      for each. Several IRIs can share a URL, e.g. the http and https forms of one (U-15).
    columnComments:
      id: The entity's number, dense, in the order the entity list returned it; the other tables refer to it.
      iri: The entity's IRI, as the ontology has it.
      type: >-
        Its type (browl.derived.EntityType): ontology, class, object_property, data_property or annotation_property.
      path: >-
        Its URL's path from the site's root (BASE_URL), in URI form (non-ASCII percent-encoded as UTF-8). For a
        fallback URL, the path and query string, /{RESERVED_PREFIX}/iri?iri={the percent-encoded IRI}.
      fragment: The fragment of a hash IRI's URL, in URI form; NULL for any other, and for every fallback URL.
      display_name: >-
        Its display name (DESIGN.md 2.7): its best name value, else its CURIE, else its IRI; for the ontology, its
        title (meta.title) if it has one.
      curie: Its CURIE, from the longest namespace in the prefix table that covers it; NULL if none does.
  - table: name_value
    tableComment: >-
      Each entity's values of the name properties (NAME_PROPERTIES), for display names and search: one row per value
      and name property, direct if the entity has it under that property itself, else entailed through
      rdfs:subPropertyOf; stored in entity order.
    columnComments:
      entity: The entity (entity.id).
      property: The name property's IRI.
      value: The value's lexical form.
      normalized: The value normalized for search (browl.names.normalize).
      language: The value's language tag, lowercased; NULL if it has none.
      direct: 1 if the entity has the value under this property itself, 0 if under one of its sub-properties.
  - table: edge
    tableComment: >-
      The hierarchies' named direct parent-child edges, between equivalence-group representatives, stored in key
      order.
    columnComments:
      hierarchy: Which hierarchy, named by its entities' type (entity.type), e.g. class or object_property.
      parent: The parent (entity.id).
      child: The child (entity.id).
  - table: equiv_group
    tableComment: >-
      Groups of named classes linked by owl:equivalentClass (union-find), and of a hierarchy's entities in a cycle of
      edges. Only groups of more than one entity have rows; any other entity is its own representative.
    columnComments:
      entity: An entity in a group (entity.id).
      representative: >-
        The group's representative (entity.id), its first IRI, which stands for the group in edge and counts.
  - table: counts
    tableComment: >-
      Each hierarchy node's numbers of children and of distinct descendants (DESIGN.md 2.5): a row for every entity of
      the hierarchy's type that is a group's representative or in no group, except owl:Thing and the other top and
      bottom entities.
    columnComments:
      hierarchy: Which hierarchy, as in edge.hierarchy.
      node: The node (entity.id).
      children: How many immediate children it has.
      descendants: How many distinct descendants it has, each counted once however many paths lead to it.
  - table: usage_root
    tableComment: >-
      The blank-node owner map's roots (P-27, DESIGN.md 2.5, browl.precache.owner_map): the axioms that reach entities
      through blank nodes (class expressions, lists, annotations on reified axioms), by the top-level triple, reified
      axiom or unlinked blank node each hangs from. Only roots that are some entity's usage (usage_ref) are kept.
    columnComments:
      id: The root's number, dense.
      kind: >-
        What it is (browl.derived.UsageRootKind): triple, a triple from an IRI to a blank node (owner predicate
        _:label); axiom, a reified axiom (owl:Axiom or owl:Annotation); general, a blank node nothing links to, with
        no owner (a general class axiom, an n-ary axiom, a negative property assertion, a SWRL rule).
      label: The root's blank node, by its label in the store (Jena's afn:bnode), which a query can name as <_:label>.
      owner: >-
        The entity whose axiom it is (entity.id, its IRI's first): a triple's subject, a reified axiom's
        owl:annotatedSource; NULL if that's no entity (owner_iri) or there's none.
      owner_iri: The owner's IRI, if it's no entity (an individual, an undeclared IRI); else NULL.
      predicate: A triple's predicate, or a reified axiom's owl:annotatedProperty; NULL for a general root.
  - table: usage_ref
    tableComment: >-
      Which roots are which entities' usages, stored in key order: a root is a usage of each entity it names but its
      owner, and but a class in a general class axiom or n-ary class axiom, or a property in an n-ary property axiom,
      which are their own axioms (DESIGN.md 2.8).
    columnComments:
      entity: The entity (entity.id, its IRI's first).
      root: The root (usage_root.id).
  - table: usage_blank
    tableComment: >-
      Per entity, the triples with a blank subject that have it as object or predicate, which usage counts take from
      Fuseki's unfiltered counts (browl.usages.count_usages). Entities with none have no row.
    columnComments:
      entity: The entity (entity.id, its IRI's first).
      object: How many triples with a blank subject have it as object.
      predicate: How many triples with a blank subject have it as predicate.
  - table: hash_prefix
    tableComment: >-
      Every distinct URL path that has hash entities (entity.fragment not NULL) under it, for the hash-IRI script
      (U-13), stored in key order.
    columnComments:
      path: The URL path, as in entity.path.
  - table: prefix
    tableComment: >-
      CURIE prefixes, for entity.curie: the built-in ones, overridden by those the ontology file declares, overridden by
      EXTRA_PREFIXES.
    columnComments:
      prefix: The prefix name; empty for the default prefix.
      namespace: The namespace IRI it stands for.
