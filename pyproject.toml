[project]
name = "browl"
version = "0.1.0"
description = "Host an OWL ontology as a browsable website, with a page for every entity at a URL implied by its IRI."
readme = "README.md"
authors = [{ name = "Jeffrey C. Lerman", email = "Jeffrey.Lerman@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.poetry]
requires-poetry = ">=2.5.1"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
fastapi = "^0.163"
pydantic-settings = "^2.16.3"
pydantic = "^2.14.3"
langcodes = "^3.5.1"
uvicorn = "^0.54.0"
httpx2 = "^2.16.0"
httpcore2 = "^2.16.0"
jpype1 = "^1.7.1"
jinja2 = "^3.1.6"
python-multipart = ">=0.0.34,<0.1"
pyroaring = "^1.2.0"

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.1"
pre-commit = "^4.7.0"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
pytest-playwright = "^0.10.0"
pytest-sugar = "^1.1.1"
rdflib = "^7.6.0"

[tool.pytest]
# An xfail test that unexpectedly passes is a failure, not a silent pass.
xfail_strict = true
# When run with --cov, record which test covered each line; no effect otherwise.
addopts = ["--cov-context=test", "--strict-markers", "--durations=15"]
markers = [
    "jvm: needs a JVM and robot.jar; skipped when Java is not available (fails in CI)",
    "fuseki: needs Fuseki, from BROWL_TEST_FUSEKI_URL or started with Docker; skipped when neither is available (fails in CI)",
    "browser: needs Playwright's headless Chromium (make browser); skipped when it's not installed (fails in CI)",
]
# Show full assertion diffs (as with -vv) without making other output verbose.
verbosity_assertions = 2
filterwarnings = [
    # pytest-base-url, which pytest-playwright uses, defines a session fixture as a method.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]

[tool.coverage.run]
# Measure the browl package, including modules no test imports.
source = ["browl"]
# Also measure Python subprocesses, such as `python -m browl.ofn`.
patch = ["subprocess"]

[tool.coverage.report]
# Show coverage percentages to two decimal places.
precision = 2
# Fail (under --cov) when line coverage drops below this.
fail_under = 90

[tool.coverage.html]
# In the HTML report, show which tests covered each line (record them with
# pytest --cov-context=test).
show_contexts = true

[tool.mypy]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# JPype has no type annotations; Java objects reached through it are Any (docs/CODING-STANDARDS.md).
module = ["jpype", "jpype.*"]
ignore_missing_imports = true

[tool.ruff]
# Max line length for the formatter, the import sorter, and E501.
line-length = 120

[tool.ruff.lint]
# Enable these rule sets on top of ruff's defaults (E4, E7, E9, F):
#   E   = pycodestyle errors (all of them, not just the default subset)
#   W   = pycodestyle warnings
#   I   = isort (import sorting)
#   UP  = pyupgrade (modernize syntax for the target Python version)
#   B   = flake8-bugbear (likely bugs and design problems)
#   C4  = flake8-comprehensions (simpler/faster comprehensions)
#   T20 = flake8-print (flag print() and pprint() calls)
#   D   = pydocstyle, as in flake8-docstrings (docstring presence and style)
#   RUF = ruff's own rules
#   SIM = flake8-simplify (simpler equivalents)
#   N   = pep8-naming
#   D401 = docstring summary in the imperative mood (off under the google convention below)
extend-select = ["E", "W", "I", "UP", "B", "C4", "T20", "D", "RUF", "SIM", "N", "D401"]
# Rules to skip:
#   B028 = warnings.warn() without an explicit stacklevel
#   D206, D300 = conflict with ruff-format, which already handles them
#   SIM108 = prefer a ternary over if/else assignment, even where that reads worse
ignore = ["B028", "D206", "D300", "SIM108"]
# The en dash is used deliberately (e.g. "N-1–N-3"), so RUF001-003 shouldn't flag it.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Spike code is throwaway: no docstrings required, and it reports by printing (see docs/CODING-STANDARDS.md).
"research/**" = ["D", "T20"]
# Deployment checks, run in a container, report by printing.
"docker/**" = ["T20"]

[tool.ruff.lint.pydocstyle]
# Which docstring style D enforces (Google style, per AGENTS.md).
convention = "google"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
