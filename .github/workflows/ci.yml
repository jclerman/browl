name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the newest one the dependencies support.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # Installed before setup-python so setup-python can cache Poetry's venvs.
      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      # Reuse pre-commit's hook environments between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Java for the tests marked jvm; `make test` downloads robot.jar for them, and those marked fuseki build and start
      # browl's Fuseki image. GitHub sets CI, so tests whose needs are missing fail instead of being skipped
      # (tests/conftest.py).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The robot.jar that `make test` downloads, keyed by the Dockerfile that pins it.
      - name: Cache robot.jar
        id: robot-jar
        uses: actions/cache@v6
        with:
          path: .cache/robot.jar
          key: robot-jar-${{ hashFiles('Dockerfile') }}

      # Checkout gives the Dockerfile the current time, so a restored jar looks older than it, and make would download
      # it again. The key matched the Dockerfile, so the jar is current.
      - name: Mark the restored robot.jar as current
        if: steps.robot-jar.outputs.cache-hit == 'true'
        run: touch .cache/robot.jar

      # Jena's tools, which `make test` downloads for the tests that load stores; cached and marked current alike.
      - name: Cache Jena
        id: jena
        uses: actions/cache@v6
        with:
          path: .cache/jena
          key: jena-${{ hashFiles('Dockerfile') }}

      - name: Mark the restored Jena as current
        if: steps.jena.outputs.cache-hit == 'true'
        run: touch .cache/jena/bin/tdb2.tdbloader

      - name: Install dependencies, lint, and test
        run: make install ci

  images:
    name: Build and start the Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built with Bake from docker-compose.yml so the layers are cached in GitHub's cache, one scope per image. The
      # tags are Compose's own image names, so `docker compose up` uses these images instead of building them again.
      # The sandbox's image is built from the app's Dockerfile, so it reads the app's cache.
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            app.tags=browl-app
            fuseki.tags=browl-fuseki
            sandbox.tags=browl-sandbox
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max
            fuseki.cache-from=type=gha,scope=fuseki
            fuseki.cache-to=type=gha,scope=fuseki,mode=max
            sandbox.cache-from=type=gha,scope=app

      # .env.example's settings: a local BASE_URL, authentication off.
      - name: Start the services and wait until they're healthy
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 120

      # The app's own health check passes even when Fuseki is down, so check that it reaches Fuseki.
      - name: Check that the app reaches Fuseki
        run: curl -fsS http://localhost:8000/_browl/health | jq -e '.fuseki == "up"'

      - name: Check Java and the tools in the images
        run: |
          docker compose exec -T app sh -c \
            'test -d "$JAVA_HOME" && java -version && test -f "$ROBOT_JAR" && "$JENA_HOME/bin/tdb2.tdbloader" --version'
          docker compose exec -T fuseki java -version

      # P-30: ROBOT and the OFN lister run in the sandbox, which has no network (no DNS either), none of the app's files
      # but the jobs volume, none of its settings, and the hardening docker-compose.yml gives it. Each network check
      # passes only on the error it expects. `!` alone doesn't fail a step, hence `|| exit 1`.
      - name: Check the sandbox's isolation
        run: |
          docker inspect "$(docker compose ps -q sandbox)" | jq -e '.[0] | .Config.User == "10001:10001"
            and (.HostConfig | .NetworkMode == "none" and .ReadonlyRootfs and .CapDrop == ["ALL"]
              and .SecurityOpt == ["no-new-privileges:true"] and .PidsLimit > 0 and .Tmpfs["/tmp"] != null)'
          docker compose exec -T sandbox python -c '
          import socket
          try:
              socket.getaddrinfo("fuseki", 3030)
          except socket.gaierror:
              raise SystemExit(0)
          raise SystemExit("fuseki resolved")'
          docker compose exec -T sandbox python -c '
          import errno, socket
          try:
              socket.create_connection(("1.1.1.1", 443), 5)
          except OSError as error:
              raise SystemExit(0 if error.errno == errno.ENETUNREACH else f"unexpected error: {error!r}")
          raise SystemExit("connected")'
          docker compose exec -T app test -f /data/state.sqlite3
          docker compose exec -T sandbox sh -c 'test "$(ls -A /data)" = uploads && test -z "$(ls -A /fuseki)"'
          environment=$(docker compose exec -T sandbox env)
          ! grep -E '^(BASE_URL|AUTH_DISABLED|OIDC_|SEED_ADMINS|SANDBOX_SOCKET)=' <<< "$environment" || exit 1

      # The control: run in the app's container, ROBOT's imports reach their targets, so the next check can see a leak.
      - name: Check that ROBOT's imports reach their targets without the sandbox
        run: docker compose exec -T app python - --unsandboxed < docker/sandbox-check.py

      # ROBOT and the OFN lister work in the sandbox, and ROBOT's imports reach nothing (docker/sandbox-check.py).
      - name: Check the tools in the sandbox
        run: docker compose exec -T app python - < docker/sandbox-check.py

      # Fuseki's admin protocol is open to anything that reaches it, so its port must stay inside the Compose network.
      - name: Check that Fuseki isn't reachable from the host
        run: |
          test -z "$(docker port "$(docker compose ps -q fuseki)")"
          ! curl -fsS --max-time 5 'http://localhost:3030/$/ping'

      # O-9: Fuseki records registered datasets in its volume, so they survive a restart. Registered from the app's
      # container, as the app will register its stores (DESIGN.md §2.4).
      - name: Check that a registered dataset survives a Fuseki restart
        run: |
          docker compose exec -T app \
            curl -fsS -X POST --data 'dbName=ci-check&dbType=tdb2' 'http://fuseki:3030/$/datasets'
          docker compose restart fuseki
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose exec -T app curl -fsS 'http://fuseki:3030/$/datasets/ci-check'

      # U-16: with Fuseki down the app stays up, to serve its "not available" page; its health route still answers 200.
      - name: Check that the app stays healthy, reporting Fuseki down, when Fuseki stops
        run: |
          docker compose stop fuseki
          curl -fsS http://localhost:8000/_browl/health | jq -e '.fuseki == "down"'
          docker compose exec -T app curl -fsS http://localhost:8000/_browl/health

      - name: Show the services' logs
        if: failure()
        run: docker compose logs

      - name: Stop the services
        if: always()
        run: docker compose down -v

  # The check that branch protection requires: one stable name, whatever the jobs above are. It must run even when a
  # job fails (a skipped required check counts as passing), so it checks the results explicitly.
  ci-result:
    name: Lint and test
    if: always()
    needs: [lint-and-test, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "Jobs that didn't succeed:"
            echo "$failed"
            exit 1
          fi
