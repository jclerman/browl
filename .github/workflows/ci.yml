name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the newest one the dependencies support.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # Installed before setup-python so setup-python can cache Poetry's venvs.
      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      # Reuse pre-commit's hook environments between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies, lint, and test
        run: make install ci

  images:
    name: Build the Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the app and Fuseki images
        run: docker compose build

  # The check that branch protection requires: one stable name, whatever the jobs above are. It must run even when a
  # job fails (a skipped required check counts as passing), so it checks the results explicitly.
  ci-result:
    name: Lint and test
    if: always()
    needs: [lint-and-test, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success"
