<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img"
     aria-label="The browl owl perched in a class tree">
  <title>browl owl in a class tree</title>
  <!-- Concept 4, "perched on the tree view". See README.md in this folder. The owl is browl-logo.svg without its
       perch: one entry in a class tree drawn like browl's hierarchy view, sitting on its own row's connector. -->
  <style>
    :root {
      --ink: #1a2f5e; --pupil: #0f1a33; --on-ink: #e6eefa;
      --node-fill: url(#node-light); --body-fill: url(#body-light); --disc-fill: url(#disc-light);
      --wing-fill: url(#wing-light); --branch-fill: url(#branch-light);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #9dbcf0; --on-ink: #0f1a33;
        --node-fill: url(#node-dark); --body-fill: url(#body-dark); --disc-fill: url(#disc-dark);
        --wing-fill: url(#wing-dark); --branch-fill: url(#branch-dark);
      }
    }
  </style>
  <defs>
    <radialGradient id="node-light" cx=".5" cy=".5" r=".5" fx=".68" fy=".32">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fb8e4"/>
    </radialGradient>
    <radialGradient id="node-dark" cx=".5" cy=".5" r=".5" fx=".68" fy=".32">
      <stop offset="0" stop-color="#5a7cc0"/><stop offset="1" stop-color="#0f1a33"/>
    </radialGradient>
    <radialGradient id="eye-shine" cx=".5" cy=".5" r=".5" fx=".68" fy=".32">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#f5b330"/>
      <stop offset="1" stop-color="#c97a08"/>
    </radialGradient>
    <radialGradient id="body-light" cx=".5" cy=".45" r=".75" fx=".7" fy=".22">
      <stop offset="0" stop-color="#2f5296"/><stop offset="1" stop-color="#121f40"/>
    </radialGradient>
    <radialGradient id="body-dark" cx=".5" cy=".45" r=".75" fx=".7" fy=".22">
      <stop offset="0" stop-color="#cfe0fb"/><stop offset="1" stop-color="#7393cc"/>
    </radialGradient>
    <radialGradient id="disc-light" cx=".5" cy=".5" r=".5" fx=".66" fy=".34">
      <stop offset="0" stop-color="#4a6fb5"/><stop offset="1" stop-color="#28457f"/>
    </radialGradient>
    <radialGradient id="disc-dark" cx=".5" cy=".5" r=".5" fx=".66" fy=".34">
      <stop offset="0" stop-color="#e6effc"/><stop offset="1" stop-color="#adc4ec"/>
    </radialGradient>
    <linearGradient id="wing-light" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#3a5da2"/><stop offset="1" stop-color="#1d3770"/>
    </linearGradient>
    <linearGradient id="wing-dark" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#d4e3f9"/><stop offset="1" stop-color="#93b1e3"/>
    </linearGradient>
    <linearGradient id="branch-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8764a"/><stop offset="1" stop-color="#5a3519"/>
    </linearGradient>
    <linearGradient id="branch-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0ac76"/><stop offset="1" stop-color="#9a6436"/>
    </linearGradient>
  </defs>
  <symbol id="owl" viewBox="0 0 64 64">
    <!-- Body, wings, facial discs -->
    <path d="M13 6 L23 16 Q32 12 41 16 L51 6 L51 34 Q51 60 32 61 Q13 60 13 34 Z" style="fill: var(--body-fill)"/>
    <path d="M13 30 Q11 46 21 58 Q16.5 44 19 31 Z M51 30 Q53 46 43 58 Q47.5 44 45 31 Z" style="fill: var(--wing-fill)"/>
    <circle cx="24.5" cy="27" r="9.5" style="fill: var(--disc-fill)"/>
    <circle cx="39.5" cy="27" r="9.5" style="fill: var(--disc-fill)"/>

    <!-- Feather texture: tufts and forehead, wings, breast (faint, behind the tree) -->
    <g style="stroke: var(--on-ink)" fill="none" stroke-linecap="round" stroke-width="1">
      <path opacity=".45" d="M16 9.5 L22 15.5 M48 9.5 L42 15.5 M24 19.5 q2 2.4 4 0 q2 2.4 4 0 q2 2.4 4 0 q2 2.4 4 0"/>
      <path opacity=".4" d="M14.5 40 q2.5 2 5 0 M14.5 46 q2.5 2 5 1 M16.5 52 q2 2 4 1 M49.5 40 q-2.5 2 -5 0 M49.5 46 q-2.5 2 -5 1 M47.5 52 q-2 2 -4 1"/>
      <path opacity=".2" d="M19.5 45 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0 M22 51 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0 M24.5 57 q2.5 2.5 5 0 q2.5 2.5 5 0 q2.5 2.5 5 0"/>
    </g>

    <!-- Eyes: shaded irises, pupils, glints -->
    <circle cx="24.5" cy="27" r="6.5" fill="url(#eye-shine)" style="stroke: var(--ink)" stroke-width="1.2"/>
    <circle cx="39.5" cy="27" r="6.5" fill="url(#eye-shine)" style="stroke: var(--ink)" stroke-width="1.2"/>
    <circle cx="24.5" cy="27" r="2.8" style="fill: var(--pupil)"/>
    <circle cx="39.5" cy="27" r="2.8" style="fill: var(--pupil)"/>
    <circle cx="25.6" cy="25.8" r="0.9" fill="#ffffff"/>
    <circle cx="40.6" cy="25.8" r="0.9" fill="#ffffff"/>

    <!-- Beak: shadowed left face, lit right face, ridge highlight, outline -->
    <g stroke-linejoin="round">
      <path d="M29.3 32.6 Q32 31.2 34.7 32.6 L32.4 37.6 Q32 38.6 31.6 37.6 Z" fill="#a8650a"/>
      <path d="M32 31.9 Q33.6 32 34.7 32.6 L32.4 37.6 Q32.2 38.1 32 37.9 Z" fill="url(#eye-shine)"/>
      <path d="M32.4 32.6 L32.25 36.4" stroke="#fff4cc" stroke-width=".5" stroke-linecap="round" opacity=".85"/>
      <path d="M29.3 32.6 Q32 31.2 34.7 32.6 L32.4 37.6 Q32 38.6 31.6 37.6 Z" fill="none" style="stroke: var(--pupil)" stroke-width=".6"/>
    </g>

    <!-- Breast: a class tree (root, two subclasses, four leaves) -->
    <path d="M32 42 L25 48.5 M32 42 L39 48.5 M25 48.5 L21.5 55 M25 48.5 L28.5 55 M39 48.5 L35.5 55 M39 48.5 L42.5 55"
          style="stroke: var(--on-ink)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <g style="fill: var(--node-fill)">
      <circle cx="32" cy="42" r="2.6"/>
      <circle cx="25" cy="48.5" r="2.3"/><circle cx="39" cy="48.5" r="2.3"/>
      <circle cx="21.5" cy="55" r="1.9"/><circle cx="28.5" cy="55" r="1.9"/>
      <circle cx="35.5" cy="55" r="1.9"/><circle cx="42.5" cy="55" r="1.9"/>
    </g>

    <!-- Talons -->
    <path d="M25 58.5 v4 M27.5 58.5 v4 M30 58.5 v4 M34 58.5 v4 M36.5 58.5 v4 M39 58.5 v4"
          stroke="#f5b83d" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <!-- Tree connectors; the owl's row is the perch -->
  <g style="stroke: var(--ink)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 11 V58 H15 M8 24 H15"/>
    <path d="M8 41.6 H60" stroke-width="2.2"/>
  </g>

  <!-- Class-name placeholders -->
  <g style="fill: var(--ink)" opacity=".3">
    <rect x="15" y="4.5" width="24" height="5" rx="2.5"/>
    <rect x="24" y="21.5" width="9" height="5" rx="2.5"/>
    <rect x="24" y="55.5" width="22" height="5" rx="2.5"/>
  </g>

  <!-- Class nodes -->
  <g style="fill: var(--disc-fill)">
    <circle cx="8" cy="7" r="4.2"/>
    <circle cx="18.5" cy="24" r="3.5"/>
    <circle cx="18.5" cy="58" r="3.5"/>
  </g>

  <use href="#owl" x="33" y="16" width="26" height="26"/>
</svg>
